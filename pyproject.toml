[project]
name = "mem-eval"
version = "0.1.0"
description = "Evaluate memory-system quality from recorded agent trajectories (memgraph + injudge)."
requires-python = ">=3.11"
dependencies = [
    # injudge CLI progress bars (the judge itself is the TS agent under
    # agent/, installed with npm). memgraph is stdlib-only.
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# The repo is not an installable package; the tools run as `uv run -m ...`
# from the checkout root. uv includes the dev group by default.
package = false

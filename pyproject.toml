[project]
name = "mem-eval"
version = "0.1.0"
description = "Evaluate memory-system quality from recorded agent trajectories (memgraph + injudge)."
requires-python = ">=3.11"
dependencies = [
    # injudge runtime: o200k_base budget estimate + CLI progress bars.
    # memgraph itself is stdlib-only.
    "tiktoken",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]
# Build-only stack for data/utils (SWE-bench data construction). Never
# imported by memgraph/injudge; kept in the shared repo env so the data
# build needs no second venv.
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "huggingface_hub>=0.23",
]

[tool.uv]
# The repo is not an installable package; the tools run as `uv run -m ...`
# from the checkout root. Both groups sync by default so `uv run` never
# strips the data-build stack from the shared .venv.
package = false
default-groups = ["dev", "data"]
